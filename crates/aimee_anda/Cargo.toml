[package]
name = "aimee_anda"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Anda/KIP integration for Aimee: eternal session pathways and chat rollbacks"

[features]
default = []
# Enable direct anda_kip parsing helpers (optional; HTTP nexus works without it)
kip = ["dep:anda_kip"]

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
chrono.workspace = true
derive_more.workspace = true
derive_setters.workspace = true
hex.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
uuid.workspace = true
aimee_domain.workspace = true
anda_kip = { version = "0.11", optional = true }

[dev-dependencies]
pretty_assertions.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "time", "test-util"] }

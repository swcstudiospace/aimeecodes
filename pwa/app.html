<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#FF5AC8" />
  <meta name="description" content="Aimee Codes — WEB3-native AI coding agent. Terminal TUI today. Installable PWA for browser and mobile." />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Aimee Codes" />
  <title>Aimee Codes</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icons/icon-192.png" type="image/png" />
  <link rel="apple-touch-icon" href="./icons/icon-192.png" />
  <style>
    :root {
      --void: #080612;
      --ink: #f0f4ff;
      --cyan: #00e5ff;
      --rose: #FF5AC8;
      --magenta: #ff8ad8;
      --violet: #a855f7;
      --lime: #a3ff12;
      --gold: #ffd200;
      --rail: #120c22;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: var(--void); color: var(--ink); }
    body {
      font-family: "IBM Plex Mono", "SFMono-Regular", ui-monospace, Menlo, monospace;
      background:
        radial-gradient(1200px 600px at 10% -10%, rgba(0,229,255,.12), transparent 50%),
        radial-gradient(900px 500px at 110% 10%, rgba(255,45,149,.14), transparent 45%),
        var(--void);
    }
    .scan {
      pointer-events: none;
      position: fixed; inset: 0;
      background: repeating-linear-gradient(
        to bottom,
        transparent 0 2px,
        rgba(0,0,0,.18) 2px 3px
      );
      mix-blend-mode: multiply;
      z-index: 8;
    }
    header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 1rem 1.25rem; gap: 1rem;
      border-bottom: 1px solid rgba(0,229,255,.25);
    }
    .brand { display: flex; align-items: baseline; gap: .7rem; letter-spacing: .18em; }
    .aimee { color: var(--rose); font-size: 1.6rem; letter-spacing: 0; }
    .name { font-weight: 700; font-size: .85rem; }
    .tag { color: var(--lime); font-size: .68rem; letter-spacing: .08em; }
    .actions { display: flex; gap: .5rem; flex-wrap: wrap; }
    button {
      font: inherit; cursor: pointer; border: 0; border-radius: 0;
      padding: .45rem .7rem; letter-spacing: .06em;
    }
    #install {
      background: var(--cyan); color: var(--void); font-weight: 700;
    }
    #install[hidden] { display: none; }
    #wallet {
      background: transparent; color: var(--magenta);
      outline: 1px solid var(--magenta);
    }
    main { display: grid; grid-template-columns: 7.5rem 1fr; min-height: calc(100dvh - 4.2rem); }
    nav {
      background: var(--rail);
      border-right: 1px solid rgba(168,85,247,.35);
      padding: 1rem .6rem;
      display: flex; flex-direction: column; gap: .65rem;
    }
    .chip {
      writing-mode: vertical-rl; transform: rotate(180deg);
      text-align: center; padding: .7rem .35rem;
      outline: 1px solid currentColor; font-size: .72rem; font-weight: 700;
    }
    .chip[data-agent="aimee"] { color: var(--rose); }
    .chip[data-agent="muse"] { color: var(--violet); }
    .chip[data-agent="sage"] { color: var(--gold); }
    .chip.active { background: currentColor; color: var(--void); }
    section { padding: 1.1rem 1.2rem 6.5rem; display: flex; flex-direction: column; gap: 1rem; }
    .lede { max-width: 40rem; color: #c9d0e8; font-size: .92rem; line-height: 1.5; }
    .lede strong { color: var(--cyan); }
    #thread { display: flex; flex-direction: column; gap: .7rem; }
    .msg {
      max-width: 42rem; padding: .75rem .85rem;
      outline: 1px solid rgba(240,244,255,.12);
    }
    .msg.user { border-left: 3px solid var(--magenta); }
    .msg.aimee { border-left: 3px solid var(--rose); }
    .msg .who { font-size: .65rem; letter-spacing: .14em; color: var(--gold); margin-bottom: .35rem; }
    footer.compose {
      position: fixed; left: 7.5rem; right: 0; bottom: 0;
      padding: .75rem 1rem calc(.75rem + env(safe-area-inset-bottom));
      background: linear-gradient(to top, #080612 70%, transparent);
      display: grid; grid-template-columns: 1fr auto; gap: .55rem;
    }
    textarea {
      resize: none; min-height: 3.4rem; max-height: 8rem;
      background: #0d0a18; color: var(--ink); border: 1px solid rgba(0,229,255,.35);
      font: inherit; padding: .65rem .7rem;
    }
    #send { background: var(--lime); color: var(--void); font-weight: 700; }
    .status { font-size: .68rem; color: #8b93b0; }
    @media (max-width: 640px) {
      main { grid-template-columns: 1fr; }
      nav {
        flex-direction: row; writing-mode: horizontal-tb;
        border-right: 0; border-bottom: 1px solid rgba(168,85,247,.35);
      }
      .chip { writing-mode: horizontal-tb; transform: none; flex: 1; }
      footer.compose { left: 0; }
    }
  </style>
</head>
<body>
  <div class="scan" aria-hidden="true"></div>
  <header>
    <div class="brand">
      <span class="aimee">æ</span>
      <span class="name">AIMEE CODES</span>
      <span class="tag">WEB3 · PWA</span>
    </div>
    <div class="actions">
      <button id="install" type="button" hidden>Install app</button>
      <button id="wallet" type="button" title="Wallet login lands with WEB3 auth">Wallet soon</button>
    </div>
  </header>
  <main>
    <nav aria-label="Agents">
      <button class="chip active" data-agent="aimee" type="button">:aimee implement</button>
      <button class="chip" data-agent="muse" type="button">:muse plan</button>
      <button class="chip" data-agent="sage" type="button">:sage research</button>
    </nav>
    <section>
      <p class="lede">
        Install this PWA on your phone or desktop. The <strong>aimee</strong> CLI remains the source of truth;
        this shell is the browser/mobile surface. Drafts stay on-device until the agent API is wired.
      </p>
      <p class="status" id="sw-status">Service worker: checking…</p>
      <div id="thread"></div>
    </section>
  </main>
  <footer class="compose">
    <textarea id="draft" maxlength="4000" placeholder=":aimee ship the wallet login…"></textarea>
    <button id="send" type="button">Send</button>
  </footer>
  <script>
    const KEY = "aimee-codes-pwa-v1";
    const thread = document.getElementById("thread");
    const draft = document.getElementById("draft");
    const installBtn = document.getElementById("install");
    const swStatus = document.getElementById("sw-status");
    let agent = "aimee";
    let deferredPrompt = null;

    function load() {
      try { return JSON.parse(localStorage.getItem(KEY) || "[]"); } catch { return []; }
    }
    function save(items) { localStorage.setItem(KEY, JSON.stringify(items)); }

    function render() {
      const items = load();
      thread.innerHTML = "";
      for (const item of items) {
        const el = document.createElement("article");
        el.className = "msg " + item.role;
        el.innerHTML = "<div class=\"who\">" + item.role.toUpperCase() + " · :" + item.agent + "</div>" +
          "<div></div>";
        el.lastChild.textContent = item.text;
        thread.appendChild(el);
      }
    }

    function send() {
      const text = draft.value.trim();
      if (!text) return;
      const items = load();
      items.push({ role: "user", agent, text, ts: Date.now() });
      items.push({
        role: "aimee",
        agent,
        text: "PWA shell captured that under :" + agent + ". Wire aimee_* crates next for a live run.",
        ts: Date.now()
      });
      save(items);
      draft.value = "";
      render();
      thread.lastElementChild?.scrollIntoView({ behavior: "smooth" });
    }

    document.querySelectorAll(".chip").forEach((btn) => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".chip").forEach((b) => b.classList.remove("active"));
        btn.classList.add("active");
        agent = btn.dataset.agent;
        draft.placeholder = ":" + agent + " …";
      });
    });
    document.getElementById("send").addEventListener("click", send);
    draft.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) send();
    });
    document.getElementById("wallet").addEventListener("click", () => {
      alert("Wallet login is the WEB3 slice — HITL spend stays off this shell.");
    });

    window.addEventListener("beforeinstallprompt", (event) => {
      event.preventDefault();
      deferredPrompt = event;
      installBtn.hidden = false;
    });
    installBtn.addEventListener("click", async () => {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      await deferredPrompt.userChoice;
      deferredPrompt = null;
      installBtn.hidden = true;
    });

    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("./sw.js").then(() => {
        swStatus.textContent = "Service worker: registered — installable offline shell.";
      }).catch(() => {
        swStatus.textContent = "Service worker: failed (serve over http://localhost).";
      });
    } else {
      swStatus.textContent = "Service worker: not supported in this browser.";
    }

    render();
  </script>
</body>
</html>

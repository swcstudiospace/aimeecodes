name: coderabbit
'on':
  pull_request:
    types:
    - opened
    - synchronize
    - reopened
    branches:
    - main
jobs:
  coderabbit:
    name: CodeRabbit CLI
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
    - name: Checkout Code
      uses: actions/checkout@v6
    - name: Install CodeRabbit CLI
      run: curl -fsSL https://cli.coderabbit.ai/install.sh | sh
    - name: Review and comment
      run: coderabbit review --committed
      env:
        CODERABBIT_API_KEY: ${{ secrets.CODERABBIT_API_KEY }}
concurrency:
  group: coderabbit-${{ github.ref }}
  cancel-in-progress: true
